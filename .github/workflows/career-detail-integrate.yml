name: Integrate Career detail

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/career-detail-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Patch Career presentation and Record 02
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text(encoding='utf-8')
          replacements = {
              '{ label: "Career", labelJa: "職務経歴", panel: "capabilities", soon: true },': '{ label: "Career", labelJa: "職務経歴", panel: "capabilities" },',
              'capabilities: { en: "Career", ja: "職務経歴", status: "THREE SIGNALS AVAILABLE" },': 'capabilities: { en: "Career", ja: "職務経歴", status: "14 RECORDS / 2019—NOW / READ ONLY" },',
              'capabilities: "CAPABILITIES.HTM",': 'capabilities: "CAREER.HTM",',
              '<span>{strength.number} / CAPABILITY</span>': '<span>{strength.number} / EXPERTISE</span>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected page.tsx text not found: {old}')
              text = text.replace(old, new, 1)

          needle = '''                </dl>\n                <ul className="portfolio-tagline" aria-label={"Record " + entry.number + " の技術・ツール"}>'''
          insertion = '''                </dl>\n                {"keyWorks" in entry && entry.keyWorks.length > 0 && (\n                  <section className="career-key-works" aria-label="Record 02 の主な担当実績">\n                    <p className="career-key-works__label" lang="en">KEY WORKS / 主な担当実績</p>\n                    <div className="career-key-works__tree">\n                      {entry.keyWorks.map((work) => (\n                        <details className="career-key-work" key={work.number}>\n                          <summary>\n                            <span className="career-key-work__index">{work.number}</span>\n                            <span className="career-key-work__heading"><b>{work.title}</b><small>{work.role}</small></span>\n                            <span className="career-key-work__toggle" aria-hidden="true" />\n                          </summary>\n                          <div className="career-key-work__body">\n                            <dl>\n                              <div><dt>ISSUE / 課題</dt><dd>{work.issue}</dd></div>\n                              <div><dt>SCOPE / 担当</dt><dd>{work.scope}</dd></div>\n                              <div><dt>RESULT / 成果・貢献</dt><dd>{work.result}</dd></div>\n                            </dl>\n                            <ul className="portfolio-tagline" aria-label={work.title + " の技術・ツール"}>\n                              {work.tools.map((tool) => <li key={tool}>{tool}</li>)}\n                            </ul>\n                          </div>\n                        </details>\n                      ))}\n                    </div>\n                  </section>\n                )}\n                <ul className="portfolio-tagline" aria-label={"Record " + entry.number + " の技術・ツール"}>'''
          if needle not in text:
              raise SystemExit('Career experience insertion point not found')
          text = text.replace(needle, insertion, 1)
          page.write_text(text, encoding='utf-8')

          data = Path('app/career-data.ts')
          text = data.read_text(encoding='utf-8')
          needle = '''      result: "仕様探索・確認業務の効率化、複数PJへの展開、AI出力の再現性・品質安定化、PoCから業務適用までの推進を支援。",\n      tools: ["RAG", "LangChain", "LangGraph", "MCP", "Box", "Slack", "Jira", "ChatGPT", "Anthropic Claude", "Codex", "Claude Code", "AGENTS.md", "Skills"],'''
          replacement = '''      result: "仕様探索・確認業務の効率化、複数PJへの展開、AI出力の再現性・品質安定化、PoCから業務適用までの推進を支援。",\n      keyWorks: [\n        {\n          number: "01",\n          title: "RAG型仕様書チャットボット構築・生成AI活用支援",\n          role: "AI活用支援 / RAG設計・構築 / 回答品質改善",\n          issue: "Excel仕様書、要求仕様書、要件定義書、画面仕様書を横断して確認する負荷が高く、仕様探索を業務フローに組み込む必要があった。既存のRAG機能では、資料形式やフォルダ構成が統一されていない資料群を広く検索し、質問に不要な情報まで参照される状態だった。",\n          scope: "LangChainを活用したRAG構成、検索対象資料の整理、チャンク分割方針、Box連携検索、Slack要約、プロンプト調整を担当。LangGraphを用いて質問内容に応じた参照資料・情報範囲の絞り込みと、後続ワークフローへの受け渡しを設計。",\n          result: "検索対象と回答生成時に扱う情報を分離し、不要な情報が回答へ混ざりにくい構成へ改善。仕様探索・確認業務の効率化、複数PJへの展開、レビュー観点整理、AI活用時の再現性・品質安定化を支援。",\n          tools: ["RAG", "LangChain", "LangGraph", "参照範囲の制御", "MCP", "Box連携検索", "Slack/API連携", "ローカルLLM", "AGENTS.md", "Skills"],\n        },\n        {\n          number: "02",\n          title: "生成AIチャットボット開発プロジェクトのPM（PoC〜業務適用）",\n          role: "AI案件PM / 5名チーム運営 / 顧客折衝",\n          issue: "顧客側でAI導入が進んでおらず、生成AIを用いた製品に対して当初から懐疑的な見方があり、要望のたびに実現可能性を問われる状況だった。",\n          scope: "5名チームのPMとして、プロトタイプ試作、顧客要望の改良案出し、チャットボット本体実装、精度検証を、状況に応じて役割配置。細かい要求ごとに試作で実現可能性を提示し、Jiraで進捗を管理しながら次回顧客会議で提示可能な状態を判断基準として運営。",\n          result: "PoCから業務適用・訴求段階まで一連の推進を担当。要望整理、優先順位付け、課題管理を顧客会議の周期に合わせて回し、懐疑的な状態から実業務での利用検討まで進めた。",\n          tools: ["AI案件PM", "PoC / プロトタイピング", "アジャイル運営", "顧客折衝", "要望整理・優先度付け", "Jira", "5名チーム"],\n        },\n        {\n          number: "03",\n          title: "生成AIによる進行管理・WBS運用ツールの内製",\n          role: "企画 / 設計・実装 / 運用設計",\n          issue: "週2回の顧客会議ごとに要望や優先度が変化し、Jiraのチケット運用だけでは変更の検知や期限・リスクの把握が遅れる懸念があった。",\n          scope: "JiraチケットのCSV出力とAIで作成した会議議事録を入力に、要望変更、優先度変更の可能性、期限・リスクの高い項目を抽出するツールを内製。出力担当LLMの結果を評価担当LLMが確認し、抜け漏れ・矛盾・根拠との不一致をフィードバックするセルフリフレクションを複数回通し、結果をSlack通知する運用を設計。",\n          result: "Jiraの自動更新や優先度の自動確定は行わず、確認候補の抽出と注意喚起に限定。精度検証担当が元チケットと会議合意に照らして確認し、人が最終判断する二段構えとして、誤ったリマインドと対応漏れによる遅延を防いだ。",\n          tools: ["生成AI内製ツール", "Jira連携（CSV）", "議事録自動生成", "セルフリフレクション", "評価LLM", "Slack通知", "WBS / 進行管理"],\n        },\n        {\n          number: "04",\n          title: "生成AI活用推進ワークショップの企画・主催",\n          role: "企画 / 主催・進行 / 指南",\n          issue: "参画先の開発IDE製品をその先の顧客へ訴求するにあたり、AI駆動開発の効果が体感されておらず、現場でのAI活用も定着していなかった。",\n          scope: "開発IDE製品を題材に、AI駆動開発（バイブコーディング）を実際に体験できるワークショップを企画・主催。プロンプトの粒度が最終成果物の精度へどう影響するかを、その場で比較・体感できる進め方を設計し、操作手順と勘所を指南。",\n          result: "参加者が製品上でAI駆動開発の効果を体験できる場をつくり、現場へのAI活用推進と製品訴求の双方に貢献。",\n          tools: ["AI駆動開発", "バイブコーディング", "プロンプト粒度設計", "ワークショップ企画・主催", "活用推進", "製品訴求"],\n        },\n      ],\n      tools: ["RAG", "LangChain", "LangGraph", "MCP", "Box", "Slack", "Jira", "ChatGPT", "Anthropic Claude", "Codex", "Claude Code", "AGENTS.md", "Skills"],'''
          if needle not in text:
              raise SystemExit('Record 02 data insertion point not found')
          text = text.replace(needle, replacement, 1)
          data.write_text(text, encoding='utf-8')

          css = Path('app/globals.css')
          text = css.read_text(encoding='utf-8')
          marker = '/* Career Record 02 expandable key works */'
          if marker in text:
              raise SystemExit('Career key works CSS already exists')
          text += '''\n\n/* Career Record 02 expandable key works */\n.career-key-works {\n  grid-column:2 / -1;\n  margin-top:2px;\n  padding-top:20px;\n  border-top:1px solid var(--modern-line);\n}\n.career-key-works__label {\n  margin:0 0 12px;\n  color:var(--modern-accent);\n  font:700 8px/1.45 var(--font-sans),sans-serif;\n  letter-spacing:.12em;\n}\n.career-key-works__tree {\n  display:grid;\n  border-top:1px solid var(--modern-line);\n}\n.career-key-work {\n  border-bottom:1px solid var(--modern-line);\n}\n.career-key-work summary {\n  display:grid;\n  grid-template-columns:34px minmax(0,1fr) 18px;\n  gap:14px;\n  align-items:center;\n  min-height:64px;\n  padding:12px 8px;\n  color:var(--modern-ink);\n  cursor:pointer;\n  list-style:none;\n  transition:background .16s ease;\n}\n.career-key-work summary::-webkit-details-marker { display:none; }\n.career-key-work summary:hover,\n.career-key-work summary:focus-visible {\n  background:rgba(12,17,47,.045);\n  outline:0;\n}\n.career-key-work__index {\n  color:var(--modern-accent);\n  font:700 9px/1 var(--font-sans),sans-serif;\n  letter-spacing:.12em;\n}\n.career-key-work__heading { display:grid; gap:5px; }\n.career-key-work__heading b {\n  font-family:var(--font-jp-display),var(--font-jp-modern),serif;\n  font-size:14px;\n  font-weight:600;\n  line-height:1.55;\n  letter-spacing:-.015em;\n}\n.career-key-work__heading small {\n  color:var(--modern-muted);\n  font-size:10px;\n  line-height:1.5;\n}\n.career-key-work__toggle {\n  position:relative;\n  width:15px;\n  height:15px;\n  border:1px solid var(--modern-ink);\n  background:#fff;\n}\n.career-key-work__toggle::before,\n.career-key-work__toggle::after {\n  content:"";\n  position:absolute;\n  left:3px;\n  right:3px;\n  top:6px;\n  height:1px;\n  background:var(--modern-ink);\n}\n.career-key-work__toggle::after {\n  top:3px;\n  bottom:3px;\n  left:6px;\n  width:1px;\n  height:auto;\n}\n.career-key-work[open] .career-key-work__toggle::after { display:none; }\n.career-key-work__body {\n  padding:4px 8px 22px 56px;\n}\n.career-key-work__body dl {\n  display:grid;\n  gap:15px;\n  margin:0 0 18px;\n}\n.career-key-work__body dl div {\n  display:grid;\n  grid-template-columns:126px minmax(0,1fr);\n  gap:18px;\n  padding-bottom:15px;\n  border-bottom:1px solid var(--modern-line);\n}\n.career-key-work__body dl div:last-child { padding-bottom:0; border-bottom:0; }\n.career-key-work__body dt {\n  color:var(--modern-accent);\n  font:700 8px/1.45 var(--font-sans),sans-serif;\n  letter-spacing:.12em;\n}\n.career-key-work__body dd {\n  margin:0;\n  color:#44444b;\n  font-size:13px;\n  line-height:1.84;\n}\n.career-key-work__body .portfolio-tagline { grid-column:auto; }\n\n@media (max-width:1040px) and (min-width:761px) {\n  .career-key-works { grid-column:2; }\n}\n@media (max-width:760px) {\n  .career-key-works { grid-column:1; margin-top:0; }\n  .career-key-work summary { grid-template-columns:28px minmax(0,1fr) 16px; gap:10px; padding-inline:4px; }\n  .career-key-work__body { padding:2px 4px 20px 38px; }\n  .career-key-work__body dl div { grid-template-columns:1fr; gap:6px; }\n}\n'''
          css.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build:pages

      - name: Verify Career remnants are gone
        run: |
          ! grep -F 'Career", labelJa: "職務経歴", panel: "capabilities", soon: true' app/page.tsx
          ! grep -F 'THREE SIGNALS AVAILABLE' app/page.tsx
          ! grep -F 'CAPABILITIES.HTM' app/page.tsx
          ! grep -F '/ CAPABILITY</span>' app/page.tsx

      - name: Commit Career refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/career-detail-integrate.yml
          git add app/page.tsx app/career-data.ts app/globals.css
          git commit -m "Refine Career AI record details"
          git push origin HEAD:main
