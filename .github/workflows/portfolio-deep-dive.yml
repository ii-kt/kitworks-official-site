name: Integrate Portfolio deep dives

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/portfolio-deep-dive.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Deepen selected Portfolio cases
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          dives = {
            "01": {
              "context": "目的は単に『仕様書をAIで検索できるようにする』ことではなく、開発者が日常的に行う仕様確認の中へAIを組み込み、必要な根拠へ短時間で到達できる状態をつくることだった。",
              "constraints": "Excel仕様書、要求仕様書、要件定義書、画面仕様書で構造や粒度が異なり、フォルダ構成も統一されていなかった。単純に検索範囲を広げると、意味的には近いが回答には不要な情報まで取得され、回答品質が不安定になる。",
              "decision": "検索対象の決定と回答生成に渡す情報を同じ処理にせず分離した。質問内容から参照すべき資料群を先に絞り、LangGraphで検索・判定・後続処理をルーティングする構成にすることで、『何を検索したか』と『何を回答根拠にしたか』を制御できる設計を優先した。",
              "process": "資料種別と質問パターンを整理し、チャンク方針と検索対象を調整。LangChain / Box連携で検索経路を構成し、LangGraphで参照範囲を制御した。実際の質問で不要参照や回答の揺れを確認しながら、プロンプト、検索条件、後続ワークフローへの受け渡しを反復調整した。",
              "outcome": "不要な情報が回答へ混ざりにくい構成となり、仕様探索と確認作業を実務フローへ載せやすくした。特定の質問だけに最適化せず、複数PJへの展開やレビュー観点整理にも使える形へ寄せた。",
            },
            "02": {
              "context": "生成AI製品に対する顧客の期待値が定まっておらず、要求が出るたびに『本当に実現できるのか』を示す必要がある状況で、PoCから業務適用までを5名チームで前進させた。",
              "constraints": "AI案件は仕様を先に固定しにくく、顧客会議のたびに要求や優先順位が変化する。少人数チームのため、担当を固定すると特定工程で待ちが発生しやすく、実装だけ進めても次回会議で判断材料を出せなければプロジェクトは前へ進まない。",
              "decision": "長い仕様検討より、要求単位で小さな試作を先に作って実現可能性を見せる進め方を採用した。役割は固定せず、プロトタイプ、改良案、実装、精度検証へ状況に応じて再配置し、『次回の顧客会議で判断できる状態か』を優先順位の基準にした。",
              "process": "顧客要望を仮説と検証単位へ分解し、Jiraへ落とし込んで担当を割り振った。試作結果を会議へ持ち込み、反応を次の要求整理へ戻す短いサイクルを継続。実装と精度検証を並行し、技術的な可否だけでなく、顧客が業務利用を判断できる材料を揃えることを重視した。",
              "outcome": "懐疑的な状態から、生成AIを実業務でどう使うかを具体的に検討できる段階までプロジェクトを進めた。PoCを作って終えるのではなく、要望整理、優先順位、品質確認、顧客合意までを一つの運営サイクルとして構築した。",
            },
            "03": {
              "context": "顧客会議のたびに要求と優先順位が変わる環境で、Jiraに登録された静的なチケットだけを見ていると、会議で生じた変更や新しいリスクの反映が遅れる問題があった。",
              "constraints": "生成AIは差分抽出や要約に有効だが、誤認識した内容でJiraを自動更新するとプロジェクト管理そのものを壊す。会議発言と既存チケットのどちらを根拠にした判断なのかも追える必要があった。",
              "decision": "AIに意思決定をさせず、『人が確認すべき変化を見つける検知層』として使う方針にした。出力LLMと評価LLMによるセルフリフレクションを通した後も、自動確定せず人が元情報と照合するHuman-in-the-loopを設計した。",
              "process": "JiraチケットCSVとAI生成の会議議事録を入力し、要望変更、優先順位変更候補、期限・リスクを抽出。評価LLMが抜け漏れ、矛盾、根拠との不一致を指摘して再生成し、その結果をSlackへ通知。精度検証担当が元チケットと会議合意に照らして最終判断した。",
              "outcome": "JiraをAIに直接操作させるリスクを避けながら、変更や対応漏れを早く検知できる補助線を追加した。自動化率ではなく、誤判断を抑えつつPMの確認負荷を下げることを優先した設計となった。",
            },
            "04": {
              "context": "AI駆動開発の価値を説明資料だけで伝えるのではなく、参画先の開発IDE製品上で実際に体験してもらい、AI活用と製品訴求を同時に進める必要があった。",
              "constraints": "参加者ごとにAI利用経験が異なり、『AIを使えば速い』という抽象的な説明では効果を判断できない。完成物だけ見せても、プロンプト設計や指示の粒度が品質へ与える影響は伝わりにくい。",
              "decision": "同じ題材に対して指示の粒度を変え、生成結果の差をその場で比較できるハンズオン形式にした。AIの性能を一方的に見せるのではなく、利用者の指示設計によって結果が変わることを体験の中心に置いた。",
              "process": "題材、操作手順、比較するプロンプトを事前に設計し、粗い指示から具体的な指示へ段階的に変化させた。生成物を比較しながら、なぜ結果が変わったか、どの情報を与えるべきか、どこを人が判断すべきかをその場で解説・指南した。",
              "outcome": "参加者がAI駆動開発の効果と限界を自分の操作で確認できる場となり、現場へのAI活用推進と開発IDE製品の価値訴求を同じ体験の中で実現した。",
            },
            "05": {
              "context": "開発が進む一方で、要求、設計、画面仕様、進捗チケットが別々に管理されると、個々の成果物が存在していても全体として整合しているか判断しにくい状態になる。",
              "constraints": "5名チームの進捗管理と、複数種類の成果物確認を並行する必要があり、単純な進捗率だけでは品質上の未解決事項を捉えられない。成果物間のつながりと、変更がどこへ波及するかも確認する必要があった。",
              "decision": "成果物レビュー、トレーサビリティ、Jiraの進捗を別作業として扱わず、同じプロジェクト状態を確認するための情報としてつなげた。レビュー観点を明示し、指摘を作成チームへ戻すフィードバックループを重視した。",
              "process": "基本設計、要求仕様書、要件定義書、画面仕様書を確認し、要求と成果物の対応関係をトレーサビリティで管理・監査。Jiraでタスクと課題を可視化し、週次報告とチーム運営へ反映。指摘内容を蓄積し、同種の不整合を早期に見つけられるよう確認観点を揃えた。",
              "outcome": "進捗だけでなく『何が完成していて、何がまだ整合していないか』を把握しやすくし、成果物品質とプロジェクト運営を一体で改善した。",
            },
            "06": {
              "context": "顧客要望を受け取り、マウンター機の既存構成へ組み込める仕様に変換しながら、C++とC#の境界をまたぐデータ連携処理を開発した。",
              "constraints": "顧客の言葉は必ずしも実装仕様の粒度ではなく、C++側とC#側でデータ型、責務、扱い方が異なる。曖昧なまま実装へ入ると、動作後にインターフェース解釈の差が表面化しやすい。",
              "decision": "先にデータの意味、変換規則、入出力の責務を整理し、顧客要望を実装可能なインターフェース仕様へ落とし込んでからコード化した。実装都合で要求を解釈せず、顧客との合意点を基準に変換処理を設計した。",
              "process": "顧客との対話で要求を分解し、C++ / C#間で受け渡すデータの対応関係を整理。設計、変換処理の実装、テスト、実機・動作確認を行い、想定外の入力や境界条件も含めて挙動を確認しながら仕様へフィードバックした。",
              "outcome": "顧客側の要求と開発側の実装解釈を揃え、仕様策定から実装・検証までを一貫して担当。単なるコーディングではなく、技術境界の翻訳役として開発を前進させた。",
            },
            "07": {
              "context": "Datadogで運用していた監視をSplunkへ移すにあたり、既存クエリ、ダッシュボード、アラートが担っていた監視意図を新基盤上で再現する必要があった。",
              "constraints": "DQLとSPLは記法だけでなくデータの扱い方や集計の考え方も異なるため、文字列を機械的に置き換えても同じ監視結果にはならない。既存利用者から見た意味を維持したまま移行する必要があった。",
              "decision": "クエリ文そのものではなく、『何を検知・可視化したいのか』という監視目的を起点に変換した。元クエリの条件、集計、時間軸、対象フィールドを分解し、Splunk側のデータ構造に合わせてSPLを再構成する方針を取った。",
              "process": "既存Datadogクエリを棚卸しし、使用フィールドと監視目的を整理。SPLへ変換した後、ダッシュボードとアラートを構築し、元の監視結果と照らして差異を確認。必要に応じて検索条件や集計方法を調整した。",
              "outcome": "単なるツール置換ではなく、既存監視の意図を維持した形でSplunkへ移行し、移行後も継続して監視・可視化できる状態を整えた。",
            },
            "08": {
              "context": "国内および北欧向けカーナビのラジオ機能を、国内外の担当者と仕様調整しながら設計・実装・テストした。",
              "constraints": "市場ごとに期待される挙動や前提が異なり、複数拠点・複数担当者の認識が少しずれるだけでも実装後の手戻りにつながる。文章上は同じ要求でも、地域条件や既存仕様との組み合わせで意味が変わることがあった。",
              "decision": "共通仕様と市場固有仕様を切り分け、曖昧な要求は実装前に動作条件と期待結果まで具体化することを優先した。顧客との調整結果を設計・テスト観点までつなげ、仕様合意と実装判断を分離しない進め方を取った。",
              "process": "国内外担当者との仕様調整、設計、C/C++実装、CANoe等を用いた確認を反復。仕様変更が入った場合は影響範囲を確認し、共通部分と地域固有部分の双方で既存挙動を壊さないことを確認した。",
              "outcome": "複数地域・複数担当者との調整を含めて、仕様策定から実装・テストまでを一貫して担当し、認識齟齬による手戻りを抑えながら開発を進めた。",
            },
            "09": {
              "context": "AUTOSAR準拠の次世代画像センサ開発でDIAG機能を担当し、自身の実装だけでなく、プロジェクトリーダーとしてメンバーの進捗と技術面も支援した。",
              "constraints": "DIAG機能は要求、AUTOSAR設定、C実装、通信、評価が複数層にまたがり、一箇所の認識差が後工程で大きな不具合として現れやすい。PLとしてチーム全体の停滞も防ぐ必要があった。",
              "decision": "要求単位で設定・実装・評価の対応関係を追えるようにし、上流の解釈を曖昧にしたまま下流工程へ流さないことを重視した。自分で抱えるのではなく、メンバーが止まっている箇所を早期に把握して技術フォローする運営を取った。",
              "process": "DIAG要求を整理し、DaVinci等のAUTOSAR設定、C実装、CANoeを用いた評価まで一連で確認。タスクを分解してメンバーへ割り振り、進捗確認と技術レビューを行い、インターフェースや設定の不整合を早い段階で解消した。",
              "outcome": "要件定義から評価までDIAG機能を一貫して推進し、技術面と管理面の双方を担当。後のPM / PMO業務につながる、実装を理解したうえでチームを動かす経験となった。",
            },
            "10": {
              "context": "Linuxベースのストレージ製品からAWSクラウドへデータを転送する新機能をPythonで設計・実装し、転送だけでなく状態監視と性能面まで確認した。",
              "constraints": "クラウド連携ではローカル処理だけと異なり、通信状態、処理時間、転送状態など外部要因を含めて考える必要がある。正常終了だけ確認しても、運用時に問題が起きた際の状態が分からなければ機能として扱いにくい。",
              "decision": "転送処理そのものと、現在どの状態にあるかを把握する監視をセットで設計した。成功時だけでなく途中状態や異常時の確認可能性を意識し、性能モニタリングを含めてクラウド連携機能を評価する方針とした。",
              "process": "PythonでAWSへのデータ転送処理を設計・実装し、Linux上で動作状態を確認。転送条件や状態変化を確認しながら性能モニタを用いて処理負荷・挙動を評価し、機能単体だけでなく運用時に観測できる状態まで検証した。",
              "outcome": "データ転送、状態確認、性能確認を一体で検証し、クラウド連携機能を実運用へつなげるための基礎を整えた。",
            },
          }

          data_path = Path('app/portfolio-data.ts')
          text = data_path.read_text(encoding='utf-8')
          for number, dive in dives.items():
              start = text.find(f'    number: "{number}"')
              if start < 0:
                  raise SystemExit(f'Portfolio case {number} not found')
              tags_pos = text.find('    tags: [', start)
              if tags_pos < 0:
                  raise SystemExit(f'Portfolio case {number} tags not found')
              segment = text[start:tags_pos]
              if '    deepDive:' in segment:
                  raise SystemExit(f'Portfolio case {number} already has deepDive')
              lines = ['    deepDive: {']
              for key in ['context', 'constraints', 'decision', 'process', 'outcome']:
                  lines.append(f'      {key}: {json.dumps(dive[key], ensure_ascii=False)},')
              lines.append('    },')
              block = '\n'.join(lines) + '\n'
              text = text[:tags_pos] + block + text[tags_pos:]
          data_path.write_text(text, encoding='utf-8')

          page_path = Path('app/page.tsx')
          text = page_path.read_text(encoding='utf-8')
          old_header = 'copy="公開している職務情報と実務記録から、役割・課題・担当・貢献を省略せず記録しています。"'
          new_header = 'copy="代表案件を、課題・役割だけでなく、制約、判断、進め方、成果までケーススタディとして記録しています。"'
          if old_header not in text:
              raise SystemExit('Portfolio selected cases header text not found')
          text = text.replace(old_header, new_header, 1)

          needle = '''                </dl>\n                <ul className="portfolio-tagline" aria-label={`Case ${caseStudy.number} の技術・ツール`}>'''
          insertion = '''                </dl>\n                <details className="portfolio-deep-dive">\n                  <summary>\n                    <span className="portfolio-deep-dive__toggle" aria-hidden="true" />\n                    <span className="portfolio-deep-dive__heading"><small lang="en">DEEP DIVE / CASE STUDY</small><b>判断と進め方を見る</b></span>\n                  </summary>\n                  <div className="portfolio-deep-dive__body">\n                    <dl>\n                      <div><dt>CONTEXT / 背景</dt><dd>{caseStudy.deepDive.context}</dd></div>\n                      <div><dt>CONSTRAINTS / 制約</dt><dd>{caseStudy.deepDive.constraints}</dd></div>\n                      <div><dt>DECISION / 判断</dt><dd>{caseStudy.deepDive.decision}</dd></div>\n                      <div><dt>PROCESS / 進め方</dt><dd>{caseStudy.deepDive.process}</dd></div>\n                      <div><dt>OUTCOME / 成果</dt><dd>{caseStudy.deepDive.outcome}</dd></div>\n                    </dl>\n                  </div>\n                </details>\n                <ul className="portfolio-tagline" aria-label={`Case ${caseStudy.number} の技術・ツール`}>'''
          if needle not in text:
              raise SystemExit('Portfolio case detail insertion point not found')
          text = text.replace(needle, insertion, 1)
          page_path.write_text(text, encoding='utf-8')

          css_path = Path('app/globals.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Portfolio selected case deep dives */'
          if marker in css:
              raise SystemExit('Portfolio deep dive CSS already exists')
          css += '''\n\n/* Portfolio selected case deep dives */\n.portfolio-deep-dive {\n  grid-column:2 / -1;\n  margin-top:2px;\n  border-top:1px solid var(--modern-line);\n  border-bottom:1px solid var(--modern-line);\n}\n.portfolio-deep-dive summary {\n  display:flex;\n  align-items:center;\n  gap:13px;\n  min-height:58px;\n  padding:11px 8px;\n  color:var(--modern-ink);\n  cursor:pointer;\n  list-style:none;\n  transition:background .16s ease;\n}\n.portfolio-deep-dive summary::-webkit-details-marker { display:none; }\n.portfolio-deep-dive summary:hover,\n.portfolio-deep-dive summary:focus-visible { background:rgba(8,13,40,.035); outline:0; }\n.portfolio-deep-dive__toggle {\n  position:relative;\n  flex:0 0 17px;\n  width:17px;\n  height:17px;\n  border:1px solid #8d8d95;\n  background:#f7f7f4;\n  box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #c8c8c8;\n}\n.portfolio-deep-dive__toggle::before,\n.portfolio-deep-dive__toggle::after {\n  content:\"\";\n  position:absolute;\n  left:4px;\n  right:4px;\n  top:7px;\n  height:1px;\n  background:#34343a;\n}\n.portfolio-deep-dive__toggle::after {\n  left:7px;\n  right:auto;\n  top:4px;\n  width:1px;\n  height:9px;\n  transition:opacity .12s ease;\n}\n.portfolio-deep-dive[open] .portfolio-deep-dive__toggle::after { opacity:0; }\n.portfolio-deep-dive__heading { display:flex; flex-direction:column; gap:4px; }\n.portfolio-deep-dive__heading small {\n  color:var(--modern-accent);\n  font:700 8px/1.2 var(--font-sans),sans-serif;\n  letter-spacing:.12em;\n}\n.portfolio-deep-dive__heading b {\n  color:var(--modern-ink);\n  font:600 12px/1.45 var(--font-jp-modern),var(--font-sans),sans-serif;\n}\n.portfolio-deep-dive__body { padding:4px 8px 24px 38px; }\n.portfolio-deep-dive__body dl { display:grid; gap:0; margin:0; }\n.portfolio-deep-dive__body dl>div {\n  display:grid;\n  grid-template-columns:128px minmax(0,1fr);\n  gap:20px;\n  padding:17px 0;\n  border-top:1px solid var(--modern-line);\n}\n.portfolio-deep-dive__body dt {\n  color:var(--modern-accent);\n  font:700 8px/1.45 var(--font-sans),sans-serif;\n  letter-spacing:.11em;\n}\n.portfolio-deep-dive__body dd {\n  margin:0;\n  color:#44444b;\n  font-size:13px;\n  line-height:1.84;\n}\n@media (max-width:1100px) and (min-width:761px) {\n  .portfolio-deep-dive { grid-column:2; }\n}\n@media (max-width:760px) {\n  .portfolio-deep-dive { grid-column:1; }\n  .portfolio-deep-dive__body { padding:2px 8px 22px 8px; }\n  .portfolio-deep-dive__body dl>div { grid-template-columns:1fr; gap:7px; }\n}\n'''
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build:pages

      - name: Verify Portfolio deep dives
        run: |
          grep -q 'DEEP DIVE / CASE STUDY' app/page.tsx
          grep -q 'deepDive:' app/portfolio-data.ts
          grep -q 'Portfolio selected case deep dives' app/globals.css
          test "$(grep -c '    deepDive: {' app/portfolio-data.ts)" -eq 10

      - name: Commit Portfolio case studies
        run: |
