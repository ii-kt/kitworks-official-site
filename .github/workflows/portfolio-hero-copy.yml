name: Update Portfolio hero copy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/portfolio-hero-copy.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Update Portfolio hero copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '<p className="editorial-eyebrow" lang="en">AI / RAG / PM / DEVELOPMENT</p>': '<p className="editorial-eyebrow" lang="en">AI / PM / ENGINEERING</p>',
              '<h1 id="panel-title">AI/RAG × PMで、<br /><em>現場で使える<wbr />AIにする。</em></h1>': '<h1 id="panel-title">AI × PM × ENGINEERING<br /><em>構想を、現場で動く<wbr />プロダクトへ。</em></h1>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected Portfolio hero text not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit Portfolio hero copy
        run: |
          rm .github/workflows/portfolio-hero-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/portfolio-hero-copy.yml
          git commit -m "Refine Portfolio hero positioning"
          git push
