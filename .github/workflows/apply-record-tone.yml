name: Apply Career and Portfolio factual tone

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-record-tone.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Apply wording changes
        run: |
          python scripts/normalize-record-tone.py
          python scripts/normalize-record-data.py
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/portfolio-data.ts app/career-data.ts
          git commit -m "Normalize Career and Portfolio wording"
          git push
