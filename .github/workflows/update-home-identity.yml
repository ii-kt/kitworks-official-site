name: Update home identity copy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-home-identity.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Update home identity copy
        run: python scripts/update-home-identity.py
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Commit home identity copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Update home identity copy"
          git push
