name: Integrate Portfolio deep dives v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/portfolio-deep-dive-v2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Apply Portfolio case study deep dives
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, textwrap

          source = Path('.github/workflows/portfolio-deep-dive.yml').read_text(encoding='utf-8')
          start = source.index('          dives = {')
          end = source.index('\n\n          data_path =', start)
          snippet = textwrap.dedent(source[start:end])
          env = {}
          exec(snippet, {}, env)
          dives = env['dives']

          data_path = Path('app/portfolio-data.ts')
          text = data_path.read_text(encoding='utf-8')
          cases_start = text.index('export const portfolioCases = [')
          cases_end = text.index('\n];', cases_start)
          for number, dive in dives.items():
              start = text.find(f'    number: "{number}"', cases_start, cases_end)
              if start < 0:
                  raise SystemExit(f'Portfolio case {number} not found')
              tags_pos = text.find('    tags: [', start, cases_end)
              if tags_pos < 0:
                  raise SystemExit(f'Portfolio case {number} tags not found')
              segment = text[start:tags_pos]
              if '    deepDive:' in segment:
                  continue
              lines = ['    deepDive: {']
              for key in ['context', 'constraints', 'decision', 'process', 'outcome']:
                  lines.append(f'      {key}: {json.dumps(dive[key], ensure_ascii=False)},')
              lines.append('    },')
              block = '\n'.join(lines) + '\n'
              text = text[:tags_pos] + block + text[tags_pos:]
              cases_end += len(block)
          data_path.write_text(text, encoding='utf-8')

          page_path = Path('app/page.tsx')
          text = page_path.read_text(encoding='utf-8')
          old_header = 'copy="公開している職務情報と実務記録から、役割・課題・担当・貢献を省略せず記録しています。"'
          new_header = 'copy="代表案件を、課題・役割だけでなく、制約、判断、進め方、成果までケーススタディとして記録しています。"'
          if old_header in text:
              text = text.replace(old_header, new_header, 1)

          needle = '''                </dl>\n                <ul className="portfolio-tagline" aria-label={`Case ${caseStudy.number} の技術・ツール`}>'''
          insertion = '''                </dl>\n                <details className="portfolio-deep-dive">\n                  <summary>\n                    <span className="portfolio-deep-dive__toggle" aria-hidden="true" />\n                    <span className="portfolio-deep-dive__heading"><small lang="en">DEEP DIVE / CASE STUDY</small><b>判断と進め方を見る</b></span>\n                  </summary>\n                  <div className="portfolio-deep-dive__body">\n                    <dl>\n                      <div><dt>CONTEXT / 背景</dt><dd>{caseStudy.deepDive.context}</dd></div>\n                      <div><dt>CONSTRAINTS / 制約</dt><dd>{caseStudy.deepDive.constraints}</dd></div>\n                      <div><dt>DECISION / 判断</dt><dd>{caseStudy.deepDive.decision}</dd></div>\n                      <div><dt>PROCESS / 進め方</dt><dd>{caseStudy.deepDive.process}</dd></div>\n                      <div><dt>OUTCOME / 成果</dt><dd>{caseStudy.deepDive.outcome}</dd></div>\n                    </dl>\n                  </div>\n                </details>\n                <ul className="portfolio-tagline" aria-label={`Case ${caseStudy.number} の技術・ツール`}>'''
          if 'className="portfolio-deep-dive"' not in text:
              if needle not in text:
                  raise SystemExit('Portfolio case detail insertion point not found')
              text = text.replace(needle, insertion, 1)
          page_path.write_text(text, encoding='utf-8')

          css_path = Path('app/globals.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Portfolio selected case deep dives */'
          if marker not in css:
              css += '''\n\n/* Portfolio selected case deep dives */\n.portfolio-deep-dive {\n  grid-column:2 / -1;\n  margin-top:2px;\n  border-top:1px solid var(--modern-line);\n  border-bottom:1px solid var(--modern-line);\n}\n.portfolio-deep-dive summary {\n  display:flex;\n  align-items:center;\n  gap:13px;\n  min-height:58px;\n  padding:11px 8px;\n  color:var(--modern-ink);\n  cursor:pointer;\n  list-style:none;\n  transition:background .16s ease;\n}\n.portfolio-deep-dive summary::-webkit-details-marker { display:none; }\n.portfolio-deep-dive summary:hover,\n.portfolio-deep-dive summary:focus-visible { background:rgba(8,13,40,.035); outline:0; }\n.portfolio-deep-dive__toggle {\n  position:relative;\n  flex:0 0 17px;\n  width:17px;\n  height:17px;\n  border:1px solid #8d8d95;\n  background:#f7f7f4;\n  box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #c8c8c8;\n}\n.portfolio-deep-dive__toggle::before,\n.portfolio-deep-dive__toggle::after {\n  content:\"\";\n  position:absolute;\n  left:4px;\n  right:4px;\n  top:7px;\n  height:1px;\n  background:#34343a;\n}\n.portfolio-deep-dive__toggle::after {\n  left:7px;\n  right:auto;\n  top:4px;\n  width:1px;\n  height:9px;\n  transition:opacity .12s ease;\n}\n.portfolio-deep-dive[open] .portfolio-deep-dive__toggle::after { opacity:0; }\n.portfolio-deep-dive__heading { display:flex; flex-direction:column; gap:4px; }\n.portfolio-deep-dive__heading small {\n  color:var(--modern-accent);\n  font:700 8px/1.2 var(--font-sans),sans-serif;\n  letter-spacing:.12em;\n}\n.portfolio-deep-dive__heading b {\n  color:var(--modern-ink);\n  font:600 12px/1.45 var(--font-jp-modern),var(--font-sans),sans-serif;\n}\n.portfolio-deep-dive__body { padding:4px 8px 24px 38px; }\n.portfolio-deep-dive__body dl { display:grid; gap:0; margin:0; }\n.portfolio-deep-dive__body dl>div {\n  display:grid;\n  grid-template-columns:128px minmax(0,1fr);\n  gap:20px;\n  padding:17px 0;\n  border-top:1px solid var(--modern-line);\n}\n.portfolio-deep-dive__body dt {\n  color:var(--modern-accent);\n  font:700 8px/1.45 var(--font-sans),sans-serif;\n  letter-spacing:.11em;\n}\n.portfolio-deep-dive__body dd {\n  margin:0;\n  color:#44444b;\n  font-size:13px;\n  line-height:1.84;\n}\n@media (max-width:1100px) and (min-width:761px) {\n  .portfolio-deep-dive { grid-column:2; }\n}\n@media (max-width:760px) {\n  .portfolio-deep-dive { grid-column:1; }\n  .portfolio-deep-dive__body { padding:2px 8px 22px 8px; }\n  .portfolio-deep-dive__body dl>div { grid-template-columns:1fr; gap:7px; }\n}\n'''
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build:pages

      - name: Verify Portfolio deep dives
        run: |
          grep -q 'DEEP DIVE / CASE STUDY' app/page.tsx
          grep -q 'Portfolio selected case deep dives' app/globals.css
          test "$(grep -c '    deepDive: {' app/portfolio-data.ts)" -eq 10

      - name: Commit Portfolio case studies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/portfolio-deep-dive.yml .github/workflows/portfolio-deep-dive-v2.yml
          git add app/page.tsx app/portfolio-data.ts app/globals.css
          git commit -m "Deepen Portfolio selected case studies"
          git push origin HEAD:main
