          page_path = Path("app/page.tsx")
          page = page_path.read_text(encoding="utf-8")
          import_anchor = '} from "./portfolio-data";\n'
          career_import = 'import { careerRecord } from "./career-data";\n'
          if career_import not in page:
            if import_anchor not in page:
              raise SystemExit("portfolio-data import anchor not found")
            page = page.replace(import_anchor, import_anchor + career_import, 1)

          start_marker = '  if (panel === "capabilities") {'
          end_marker = '\n\n  if (panel === "process") {'
          start = page.find(start_marker)
          if start == -1:
            raise SystemExit("Career block start not found")
          end = page.find(end_marker, start)
          if end == -1:
            raise SystemExit("Career block end not found")
          page = page[:start] + career_block + page[end:]
          page_path.write_text(page, encoding="utf-8")
