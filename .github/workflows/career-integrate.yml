      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build:pages

      - name: Commit Career integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/career-integrate.yml
          git add app/page.tsx app/career-data.ts
          git commit -m "Build Career from professional records"
          git push origin HEAD:main

      - name: Remove workflow after failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          git rm --ignore-unmatch .github/workflows/career-integrate.yml
          if ! git diff --cached --quiet; then
            git commit -m "Remove failed Career integration workflow"
            git push origin HEAD:main
          fi
