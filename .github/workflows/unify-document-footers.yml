name: Unify document footers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unify-document-footers.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Unify document footers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          footer_pattern = re.compile(r'\n\s*<footer className="portfolio-document-end">.*?</footer>', re.S)
          matches = list(footer_pattern.finditer(text))
          if len(matches) != 2:
              raise SystemExit(f'Expected 2 existing document footers, found {len(matches)}')

          replacements = [
              '\n        <DocumentFooter meta={"10 CASES / CAREER 2019—NOW / RECORD UPDATED " + portfolioIdentity.updated} />',
              '\n        <DocumentFooter meta={careerRecord.experiences.length + " RECORDS / CAREER 2019—NOW / UPDATED " + careerRecord.updated} />',
          ]
          offset = 0
          for match, replacement in zip(matches, replacements):
              start = match.start() + offset
              end = match.end() + offset
              text = text[:start] + replacement + text[end:]
              offset += len(replacement) - (match.end() - match.start())

          footers = {
              'index': '<DocumentFooter meta="WELCOME / KIT WORKS / 2026" />',
              'process': '<DocumentFooter meta="05 STEPS / BUILD SEQUENCE / KIT WORKS" />',
              'about': '<DocumentFooter meta="INDEPENDENT PRACTICE / JAPAN / 2026" />',
              'approach': '<DocumentFooter meta="03 PRINCIPLES / OPERATING APPROACH / KIT WORKS" />',
              'faq': '<DocumentFooter meta="04 QUESTIONS / FAQ / KIT WORKS" />',
              'project': '<DocumentFooter meta="LOCAL BRIEF / NO TRANSMISSION / KIT WORKS" />',
              'availability': '<DocumentFooter meta="SCHEDULE / AFTER BRIEF / KIT WORKS" />',
          }

          for panel, footer in footers.items():
              marker = f'  if (panel === "{panel}") {{'
              start = text.index(marker)
              next_if = text.find('\n  if (panel === "', start + len(marker))
              end = next_if if next_if != -1 else text.find('\n  return (\n    <div className="panel-view business-view system-view">', start)
              if end == -1:
                  raise SystemExit(f'Could not find block end for {panel}')
              block = text[start:end]
              close = '\n      </div>\n    );'
              pos = block.rfind(close)
              if pos == -1:
                  raise SystemExit(f'Could not find root close for {panel}')
              insert_at = start + pos
              text = text[:insert_at] + f'\n        {footer}' + text[insert_at:]

          system_marker = '  return (\n    <div className="panel-view business-view system-view">'
          system_start = text.index(system_marker)
          system_end = text.index('\n}\n\nfunction PanelKicker', system_start)
          system_block = text[system_start:system_end]
          system_close = '\n    </div>\n  );'
          system_pos = system_block.rfind(system_close)
          if system_pos == -1:
              raise SystemExit('Could not find system root close')
          system_insert = system_start + system_pos
          text = text[:system_insert] + '\n      <DocumentFooter meta="SYSTEM INFO / SITE RECORD / 2026" />' + text[system_insert:]

          component = '''\n\nfunction DocumentFooter({ meta }: { meta: string }) {\n  return (\n    <footer className="portfolio-document-end">\n      <div className="portfolio-document-end__signature">\n        <span className="portfolio-document-end__wordmark" role="img" aria-label="KiT Works" />\n        <span lang="en">END OF DOCUMENT</span>\n      </div>\n      <p>{meta}</p>\n    </footer>\n  );\n}\n'''
          if 'function DocumentFooter(' in text:
              raise SystemExit('DocumentFooter already exists')
          text += component

          if text.count('<DocumentFooter ') != 10:
              raise SystemExit(f'Expected 10 DocumentFooter uses, found {text.count("<DocumentFooter ")}')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Commit footer unification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Unify document footers across panels"
          git push
